[project]
name = "sui"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1"]

[project.optional-dependencies]
fast = ["gmpy2==2.3.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fc: F-c の合格の試験 (関門 -m \"not fc\" から外す。紙 F-b の開発フロー ⑥、K41 では Z70 の細かい精度の試験)",
]
